# 项目术语表 · 单一真源
#
# 用法（重要，别再手写第二份术语说明）
#   1. 想加/改术语，只改本文件。
#   2. 跑 `py -3.10 tools/glossary.py build` 重新生成 LEARNING.md 的词典部分。
#   3. 跑 `py -3.10 tools/glossary.py check` 校验重复与遗漏。
#
# 字段说明
#   id        唯一标识（英文短名，禁止重复；校验脚本按它查重）
#   zh        中文名（用于文档显示）
#   en        英文/代码名（可空）
#   cat       分类：基础概念 / 数据源 / 指标 / 评分条件 / 方法论 / 工程 / 风险
#   plain     一句话大白话（面向完全新手，禁止用其它未解释的术语）
#   analogy   比喻（尽量给日常场景）
#   where     在本项目哪里出现（文件:行 或 脚本名）
#   caution   常见误解 / 坑（可空）
#
# 写新词条时的硬规则
#   - 名称不得与已有 id / zh / en 重复（含大小写与全半角差异，校验脚本会拦）
#   - plain 里若用到另一个术语，该术语必须已在本表存在
#   - 不确定的结论不要写成结论，写进 caution 并注明"待验证"

meta:
  version: 11
  updated: 2026-10-21
  note: 本文件是项目所有术语解释的唯一来源；任何文档需要术语解释时引用本文件，不要复制粘贴。

terms:

  # ========================= 基础概念 =========================
  - id: spot
    zh: 现货
    en: spot
    cat: 基础概念
    plain: 用真钱直接买卖币，一手交钱一手交货，币立刻到你账上。
    analogy: 像菜市场买菜——给钱拿菜，菜就是你的。
    where: binance_box_strategy.py 现货 exchange
    caution: 现货买了就是你的资产，不会爆仓。

  - id: futures
    zh: 合约（永续）
    en: futures / perpetual
    cat: 基础概念
    plain: 不买币本身，只赌价格涨跌的凭证。可以借钱放大，看错方向会被强制平仓（爆仓）。
    analogy: 像打赌"明天会不会下雨"，赌对了赢钱，赌错了赔钱，跟下不下雨本身没关系。
    where: binance_box_strategy.py 合约 exchange、fetch_deriv_context()
    caution: 本项目只读合约数据来判断庄家动向，**自身不做合约交易**。

  - id: usdt
    zh: USDT（泰达币）
    en: USDT
    cat: 基础概念
    plain: 一种跟美元 1:1 挂钩的稳定币，用来在币圈当"钱"计价。
    analogy: 像赌场里的筹码，进出都用它换算，价值基本不变。
    where: 所有交易对后缀 /USDT
    caution: 它本身不是投资标的，本项目把它当计价单位。

  - id: symbol
    zh: 交易对
    en: symbol
    cat: 基础概念
    plain: "两个币的组合写法，比如 BTC/USDT 表示'用 USDT 买 BTC'。"
    analogy: 像商品标签"苹果-人民币"，说明拿什么换什么。
    where: tickers 字典的 key
    caution: 带冒号的（如 BTC/USDT:USDT）是合约，本项目现货筛选时排除。

  - id: quote_volume
    zh: 成交额
    en: quoteVolume
    cat: 基础概念
    plain: 一段时间内买卖的总金额（按计价币算）。成交额大说明交易活跃。
    analogy: 像店铺一天的营业额。
    where: select_symbols() 的候选池闸门
    caution: 成交额大 ≈ 币的市值大，本项目用它当市值的代理变量。**它是成交总量，不是资金净流入**（买卖双方都计入）。

  - id: market_cap
    zh: 市值
    en: marketCap
    cat: 基础概念
    plain: 流通市值是流通中的币数量乘以当前价格，用于比较当前估价规模。
    analogy: 把一批商品都按当前单价估价，总估价不等于有人实际花了这笔钱买走整批。
    where: coingecko_caps()、Config.max_market_cap
    caution: ~~涨十倍超过全市场总钱数，所以数学上不可能~~（2026-10-05 更正）。市值不是实际流入的钱，不能用今天的全市场市值证明未来价格上限；本项目市值过滤的收益价值待验证。

  - id: pump
    zh: 爆拉
    en: pump
    cat: 基础概念
    plain: 短时间内价格快速大涨。本项目定义为波段低点起涨 ≥2 倍。
    analogy: 像坐火箭，一小段时间冲上去。
    where: research/02_detect_pumps.py、data/pumps.json
    caution: 本项目研究的是 2–10 倍，不止十倍。

  - id: pre_day
    zh: 启动前一天
    en: pre_day
    cat: 基础概念
    plain: 爆拉开始之前的那一天。策略要在这天就判断出"它可能要涨"。
    analogy: 像赛前下注，必须在发令枪响之前押注才算本事。
    where: data/features*.csv 的 pre_day 列
    caution: 这是**评估时点**，所有特征只能用这天及之前的数据。

  # ========================= 数据源 =========================
  - id: binance_vision
    zh: 币安公开数据仓库
    en: data.binance.vision
    cat: 数据源
    plain: 币安免费放出的历史行情归档，不用 API Key、不用登录，直接下载。
    analogy: 像图书馆的过期报纸合订本，随时去翻。
    where: research/00_fetch.py、01_fetch_1d.py
    caution: 这是文件下载，不占用 API 限流额度，比调接口安全。

  - id: metrics_daily
    zh: 合约指标日归档
    en: um/daily/metrics
    cat: 数据源
    plain: 币安每天打包的合约持仓数据，5 分钟一个点，2020-09 至今。
    analogy: 像银行每天给你的流水单，事后随时能查。
    where: research/05_deriv_features.py、data/metrics_cache.parquet
    caution: ~~只保留最近 30 天~~（2026-10-05 更正：误混实时接口限制）。日归档与实时查询不是同一来源；本地已有更早历史，具体日期和币种覆盖须逐文件核实。

  - id: ohlcv
    zh: K 线
    en: OHLCV
    cat: 数据源
    plain: 一根蜡烛图包含四个价（开、高、低、收）加成交量，代表一段时间。
    analogy: 像给价格拍的一张快照，压缩了这段时间的所有波动。
    where: indicators() 的输入
    caution: 本项目默认 1 小时一根。

  - id: ccxt
    zh: 交易所通用接口库
    en: ccxt
    cat: 数据源
    plain: 一个 Python 库，用同一套写法就能连币安、OKX 等几百家交易所。
    analogy: 像万能遥控器，一个遥控器控制所有品牌的电视。
    where: requirements-binance-box.txt
    caution: 它的 fetch_long_short_ratio_history 硬编码了全市场口径，要大户口径得走底层接口。

  # ========================= 指标 =========================
  - id: ema
    zh: 指数移动平均线
    en: EMA / EMA50
    cat: 指标
    plain: 价格的加权平均，越近的权重越高，反应比普通均线快。**它不是"只算最近 N 根"**——理论上会记住全部历史价格，只是越早的权重越小、趋近于 0。
    analogy: 像"近期表现的加权平均分"，新成绩占比更大，但旧成绩不会完全消失。
    where: indicators() 的 ewm(span=50, adjust=False)、条件 c_trend
    caution: 本项目用 EMA50（span=50，1h K 线）。**改更早的几根 K 线，EMA 数值也会变**——所以它不是窗口指标。

  - id: box
    zh: 箱体
    en: box
    cat: 指标
    plain: 价格在一段时间内上下震荡，画出一个矩形区间。突破上沿常被视为启动信号。
    analogy: 价格在一个矩形盒子里来回撞，撞穿上沿叫"突破"。突破是弱信号，不等于必然启动。
    where: box_score()、条件 c_breakout
    caution: 实测箱体宽度、持续时间对预测爆拉基本没用（噪音）；保留下来的"突破"也只是弱信号（区分度 +5.7pp）。

  - id: box_width
    zh: 箱体宽度
    en: box_width_pct
    cat: 指标
    plain: 箱体的上下幅度百分比。越窄说明盘整越紧。
    analogy: 只是量一下这个箱子有多高多宽——纯粹描述形状，不代表会不会爆发。
    where: box_score() 展示字段
    caution: 实测区分度仅 +0.1pp，**不计分**，只展示。

  - id: oi
    zh: 未平仓合约量
    en: OI / Open Interest
    cat: 指标
    plain: 尚未结束的合约持仓规模。本项目评分主要读取其按价格折算的总价值，价格变化也会影响这个数。
    where: fetch_deriv_context()、条件 oi_chg_1d / 3d
    caution: ~~OI 涨说明新钱进场、下注的人变多了~~（2026-10-05 更正）。盯盘时它用于提示持仓价值变化，例如价格上涨而合约数量不变，总价值也会增加；需结合价格及数量核查，不能单凭它确认新增资金或人数。

  - id: funding_rate
    zh: 资金费率
    en: funding rate
    cat: 指标
    plain: 合约持仓者定期互相付的小额费用，用来让合约价格贴近现货。
    analogy: 多空双方之间的定时"占位费"：合约价高于现货时多方向空方付，反之空方向多方付，目的是把合约价拉回现货。
    where: fetch_deriv_context() 展示字段
    caution: 实测样本外方向翻转，**不计分**。

  - id: ls_top
    zh: 大户持仓多空比
    en: topLongShortPositionRatio / ls_top
    cat: 指标
    plain: 大资金的持仓里，做多和做空的比例。小于 1 说明大户偏空（可能被逼空）。
    analogy: 像赌场里大户押注的方向表。
    where: fetch_deriv_context()、条件 ls_top
    caution: 口径陷阱——还有"全市场账户比"是另一个数。本项目用大户持仓口径。

  - id: taker
    zh: 主动买卖比
    en: taker buy/sell ratio
    cat: 指标
    plain: 主动买单和主动卖单的比例，反映谁更着急。
    analogy: 像排队时谁更急着成交。
    where: fetch_deriv_context() 展示字段
    caution: 未纳入计分。

  - id: atr
    zh: 平均真实波幅
    en: ATR
    cat: 指标
    plain: 衡量价格**平均每根 K 线**波动多大的指标，用来设止损距离。本项目用**小时线**，所以是"每小时"的平均波动，**不是每天**。
    analogy: 像给车设安全距离，车速越快留的余地越大——但这里的"车速"是按小时算的。
    where: indicators() 的 true_range.rolling(atr_period)、Config.stop_atr
    caution: 只用于计算参考止损位，不参与选币评分。**误当成"每天波动"会把止损距离估错。**

  # ========================= 评分条件 =========================
  - id: c_trend
    zh: 趋势条件
    en: c_trend
    cat: 评分条件
    plain: 收盘价高于 EMA50 就算成立，代表中期趋势向上。权重最高。
    analogy: 看这个币自己是在上坡还是下坡——收盘价站在 50 小时均线上方，算中期向上。
    where: WEIGHTS["c_trend"] = 5
    caution: 单项 5 分，是全项目最高分。⚠️ 但**门槛=5 不等于"只看这一条"**——评分各项**相加**，oi_chg_1d(4)+c_v24up(1)=5 也能达标，无需趋势。（2026-10-05 更正）

  - id: c_breakout
    zh: 突破条件
    en: c_breakout
    cat: 评分条件
    plain: 收盘价突破了之前箱体的上沿。
    analogy: 像水位冲过堤坝。
    where: WEIGHTS["c_breakout"] = 2
    caution: 区分度 +5.7pp，是有效但较弱的信号。

  - id: c_v24up
    zh: 24h 量增
    en: c_v24up
    cat: 评分条件
    plain: 最近 24 根的成交量超过前 24 根。**注意：成交量是"成交数量累加"，不是资金净流入**——买卖双方都计入；而且代码只要求"超过"，多一点点也算成立。
    analogy: 像商场统计"今天进店人次"——人次多不等于营业额高（可能只是闲逛），更不等于钱流进了谁的口袋。
    where: WEIGHTS["c_v24up"] = 1
    caution: 它只加 1 分，门槛很低（"超过"即可）。**不能据此认定"资金进场 / 有人在吸筹"。** 重复的旧写法 c_v4up（4h 量增）已移出计分。

  - id: oi_chg_1d
    zh: OI 一日增速
    en: oi_chg_1d
    cat: 评分条件
    plain: 未平仓合约量比一天前增长超过 10% 就算成立。
    analogy: 赌桌筹码一天内多了 10%。
    where: WEIGHTS["oi_chg_1d"] = 4、OI_1D_THRESHOLD = 0.10
    caution: 样本外稳定性好（提升 1.57x），是合约侧最强条件。

  - id: oi_chg_3d
    zh: OI 三日增速
    en: oi_chg_3d
    cat: 评分条件
    plain: 未平仓合约量比三天前增长超过 20% 就算成立。
    analogy: 同上，看三天的趋势。
    where: WEIGHTS["oi_chg_3d"] = 3、OI_3D_THRESHOLD = 0.20
    caution: 与 oi_chg_1d 高度相关，所以权重给得低一些。

  - id: extra_score
    zh: 辅助分
    en: extra_score
    cat: 评分条件
    plain: 市值、OKX 上架、合约成交量这些加分项，但**没经过回测验证**。
    analogy: 像简历里的加分项——HR 会看到，但不决定你能不能进面试。
    where: public_selection()
    caution: **绝不参与门槛判定**。混进去会导致实盘与回测口径不一致（BTC 曾因此误选）。

  - id: gate
    zh: 闸门
    en: gate
    cat: 评分条件
    plain: 进候选池前先按成交额与市值筛的一道关，把体量太大、翻不动的币排除掉。和"门槛"是两回事。
    analogy: 像报考资格线——不符合条件的连参加考试的机会都没有，跟你能考多少分无关。
    where: binance_box_strategy.py 的 max_quote_volume / max_market_cap
    caution: **别和"门槛"混**：闸门按体量排除（BTC 是被它挡的），门槛（min_score）按总分选择。混为一谈会得出"门槛不能降"的错误结论。

  - id: min_score
    zh: 入选门槛
    en: min_score
    cat: 评分条件
    plain: 核心分要达到这个值才能进候选池。
    analogy: 像及格线。
    where: Config.min_score
    caution: ~~低于 5 就没有任何单项能达标，5 分意味着至少趋势成立~~（2026-10-05 更正）。4 分时 OI 一日项可单独达标；5 分时合约项组合也可达标，无需趋势成立。当前值为 5，是否更适合重复捕捉机会待验证，不是不可调整的数学下限。

  - id: weights
    zh: 评分权重
    en: WEIGHTS
    cat: 评分条件
    plain: 每条条件值多少分。满分 18。
    analogy: 像考试各题的分数分配。
    where: binance_box_strategy.py:67
    caution: **全项目唯一真源**，实盘和回测都 import 它。改分只改这一处。

  # ========================= 方法论 =========================
  - id: lookahead_bias
    zh: 前视偏差
    en: lookahead bias
    cat: 方法论
    plain: 用了当时还不知道的信息来判断，等于作弊。
    analogy: 像用明天的报纸买今天的彩票。
    where: research/08_audit_hindsight.py 检查项
    caution: 常见来源：忘了 shift(1)、用当天收盘价判断当天开盘。

  - id: hindsight
    zh: 马后炮
    en: hindsight bias
    cat: 方法论
    plain: 事后看什么都对，但当时根本判断不出来。
    analogy: 像股评"我早就说过它会涨"。
    where: research/08_audit_hindsight.py
    caution: 与"前视偏差"区别：前者是数据错用，后者是逻辑上当时不可知。

  - id: oos
    zh: 样本外验证
    en: out-of-sample / OOS
    cat: 方法论
    plain: 用没参与过调参的那段时间数据来测试，看策略是不是真的有效。
    analogy: 像模拟考用没做过的卷子，才算真成绩。
    where: research/07_oos_validate.py、SPLIT = 2025-01-01
    caution: 只看样本内成绩漂亮没用，很可能是过拟合。

  - id: overfit
    zh: 过拟合
    en: overfitting
    cat: 方法论
    plain: 把历史数据的噪音也当规律学进去了，换新数据就失效。
    analogy: 像背答案而不是学方法，题一换就完蛋。
    where: 各研究脚本的样本外检验
    caution: 调参次数越多越容易过拟合。

  - id: discriminative_power
    zh: 区分度
    en: discriminative power (pp)
    cat: 方法论
    plain: 爆拉组里满足条件的比例，减去对照组里满足条件的比例。
    analogy: 像对比"病人组和健康组"某指标的差异。
    where: research/08_audit_hindsight.py 的"区分度"列
    caution: 单位是百分点(pp)。接近 0 表示**单独使用时**没测出差别——**不等于永久无用**：与其他条件组合、限定市场阶段、或放到洗盘过程里，仍可能有信息。不能据此"一律判死刑"。（2026-10-05 更正）

  - id: lift
    zh: 提升倍数
    en: lift
    cat: 方法论
    plain: 用了这条规则后的命中率，是随机瞎选的多少倍。
    analogy: 像吃某种药后治愈率是安慰剂的几倍。
    where: research/*.py 的"提升倍数"列
    caution: ⚠️ 它**也受样本正例占比影响**：同样识别能力，正例占比从 50% 降到 10%，提升倍数可从约 **1.6x 变成约 3.08x**。跨口径比较时**必须同时核对样本构成**，不能当万能换算尺。（2026-10-05 更正）

  - id: precision_recall
    zh: 精确率 / 召回率
    en: precision / recall
    cat: 方法论
    plain: 精确率=选出来的里面有多少真会涨；召回率=真会涨的里面我抓到了多少。
    analogy: 像撒网捕鱼——网小捕得准但漏得多，网大捕得多但混进杂物。
    where: research/09_backtest_revised.py
    caution: **没有固定的此消彼长关系**——调整规则可以两者同升、也可以两者同降（本项目放宽门槛后两者同时上升）。既不能只看一个，也不能假设"一个升另一个必降"。（2026-10-05 更正）

  - id: false_negative
    zh: 漏选 / 误杀
    en: false negative
    cat: 方法论
    plain: 本来会爆拉的币，被策略当成不合格筛掉了。重点：这不是"选错"，是"该抓没抓到"。
    analogy: 像渔网网眼太大——漏掉的那些里也有好鱼，只是当时分不出来。
    where: research/11_hit_rate_current.py 的"未命中归因"
    caution: 本项目说的"K线=5 整类被误杀"，指这一整档币因门槛设太高、单靠 K 线永远进不了池子（282 个爆拉币只命中 27 个）。

  - id: auc
    zh: AUC
    en: ROC-AUC
    cat: 方法论
    plain: 衡量排序能力的分数，0.5 等于瞎猜，1.0 等于完美。
    analogy: 像给裁判判分，看它把"好苹果"排在"坏苹果"前面的准确度。
    where: research/09_backtest_revised.py
    caution: 本项目 0.64–0.71，属于**弱信号**，不是必胜武器。

  - id: control_group
    zh: 对照组
    en: control group
    cat: 方法论
    plain: 同一批币在"平静期"的样本，用来跟"爆拉前"比较，排除常见特征。
    analogy: 像新药试验里的安慰剂组。
    where: research/03_build_features.py、label=0 的样本
    caution: 没有对照组，任何"条件"看起来都有效。

  - id: cross_section
    zh: 横截面排名
    en: cross-sectional rank
    cat: 方法论
    plain: 在某一天，把所有币按某个指标排个名次。
    analogy: 像考试排名，必须是全班一起排。
    where: research/08_audit_hindsight.py 的 market_rank_1d()
    caution: **分母必须是全市场**。本项目曾因在样本内排名导致条件退化（错误结论 −19.3pp）。

  - id: calibre
    zh: 口径
    en: calibre / definition
    cat: 方法论
    plain: 同一个名字的数据，可能有好几种统计方式，数值完全不同。
    analogy: 像"工资"可以是税前也可以是税后。
    where: ls_top vs ls_count
    caution: 本项目踩过最大的坑：用"全市场账户比"测出 +7.7pp，换成实盘用的"大户持仓比"只剩 +0.6pp。

  # ========================= 工程 =========================
  - id: single_source
    zh: 单一真源
    en: single source of truth
    cat: 工程
    plain: 同一个信息只在一处定义，其它地方都引用它，避免两边不一致。
    analogy: 像只有一个总开关，不装两个互相打架的开关。
    where: WEIGHTS、本术语表本身
    caution: 本术语表就是按这个原则设计的。

  - id: backtest
    zh: 回测
    en: backtest
    cat: 工程
    plain: 拿策略去跑历史数据，看如果当时用了会怎样。
    analogy: 像用旧考卷自测。
    where: research/09_backtest_revised.py
    caution: 本项目是"事件级"回测（对爆拉事件比对特征），不是逐日含成交退出的资金曲线回测。

  - id: rate_limit
    zh: 限流 / 封禁
    en: rate limit / 418 -1003
    cat: 工程
    plain: 请求太频繁被交易所拒绝服务，通常封几小时。
    analogy: 像敲门太急被保安请出去。
    where: 实盘扫描
    caution: **限流分域名**——现货 api.binance.com 通了不代表合约 fapi.binance.com 通，要分别测。

  - id: proxy
    zh: 代理
    en: proxy
    cat: 工程
    plain: 中转服务器，用来绕过网络限制。
    analogy: 像寄信时先寄到朋友家再转交。
    where: resolve_proxy()、BINANCE_PROXY 环境变量
    caution: 机场端口会变（见过 7967→7897），不通时先逐个端口探测。

  - id: parquet
    zh: Parquet
    en: parquet
    cat: 工程
    plain: 一种压缩的表格文件格式，比 CSV 小很多、读得快。
    analogy: 像把衣服抽真空压缩收纳。
    where: data/metrics_cache.parquet
    caution: 需要 pyarrow 才能读。

  - id: fail_open
    zh: 失败放行
    en: fail-open
    cat: 工程
    plain: 拿不到某个数据时，默认不拦截，而不是直接拒绝。
    analogy: 像闸机坏了就敞开，而不是锁死。
    where: select_symbols() 的市值缺失处理
    caution: 与 fail-closed（失败就拦）相对，这里选 fail-open 是为了避免池子忽大忽小。

  # ========================= 风险 =========================
  - id: liquidation
    zh: 爆仓
    en: liquidation
    cat: 风险
    plain: 借钱炒合约亏到保证金不够，被系统强制平仓，本金归零。
    analogy: 像押金赔光被赶出赌场。
    where: 本项目不涉及（无下单路径）
    caution: 一定要清楚：**本项目只筛选、不下单、不碰杠杆**。

  - id: stablecoin
    zh: 稳定币
    en: stablecoin
    cat: 风险
    plain: 价格锚定美元的加密货币。
    analogy: 像代金券，面值固定。
    where: STABLECOINS 集合
    caution: 这类币被排除出扫描范围，因为它们不会爆拉。

  - id: delisting
    zh: 下架
    en: delisting
    cat: 风险
    plain: 交易所把某个币的交易对撤掉。
    analogy: 像商场把某个柜台撤了。
    where: active 字段过滤
    caution: 下架消息有时反而引发轧空暴涨（本项目明确记录过的催化剂类型）。

  - id: short_squeeze
    zh: 轧空
    en: short squeeze
    cat: 风险
    plain: 大量做空的人被迫买回，反过来推高价格，形成连锁上涨。
    analogy: 像弹簧压到极限后空头集体回补——越买越涨，越涨越被迫买。
    where: STRATEGY_REVIEW.md 催化剂类型
    caution: 这是"下架币暴涨"的常见机制，量价指标很难提前捕捉。

  - id: catalyst
    zh: 催化剂
    en: catalyst
    cat: 风险
    plain: 可能改变市场预期或买卖需求的事件，例如下架公告、品牌升级或项目进展；事件发生不保证上涨。
    where: STRATEGY_REVIEW.md
    caution: ~~只有催化剂能解释量价未捕捉的行情~~（2026-10-05 更正）。该排他性判断待验证。盯盘时核对公告时间、具体条款和价格反应，例如下架可能改变平仓需求，也可能引发抛售；不能见到公告就推断会涨。

  # ===== 2026-10-05 补充：写 TODO.md 时发现缺失的术语 =====

  - id: candidate_pool
    zh: 候选池
    en: candidate pool
    cat: 基础概念
    plain: 经过筛选后，进入最终评分的那批币。不是全市场，是缩小后的名单。
    analogy: 像招聘先筛简历——投了 500 份，进面试的只有 30 人，这 30 人就是候选池。
    where: select_symbols()、results/*.csv
    caution: ~~不设上限会混进不可能十倍的币~~（2026-10-05 更正）。名单受成交额、市值、扫描数量及数据可得性共同影响；这些范围选择的收益与漏报代价待验证，入名单不等于应买入。

  - id: hit_rate
    zh: 命中率
    en: hit rate
    cat: 方法论
    plain: 在全部历史爆拉事件里，策略能提前识别出来的比例。
    analogy: 像守门员扑点球——100 个点球扑出 48 个，命中率就是 48%。
    where: research/11_hit_rate_current.py
    caution: 本项目当前配置（门槛=5）命中率 74.9%（822 个爆拉事件命中 616 个）；旧门槛=6 时为 48.1%（395 个）。

  - id: live_trading
    zh: 实盘
    en: live trading
    cat: 基础概念
    plain: 用真实数据、真实运行的那一套，跟"研究/回测"相对。
    analogy: 像正式比赛和训练赛的区别。
    where: binance_box_strategy.py 扫描
    caution: 本项目实盘只做筛选输出，**不下单**。

  - id: drawdown
    zh: 最大回撤
    en: drawdown / max drawdown
    cat: 方法论
    plain: 资产**先创新高、再跌到之后最低点**的最大跌幅，衡量"最惨的时候亏多少"。**必须"先高后低"**——不能拿全程最高点和全程最低点直接相减。
    analogy: 像坐过山车——只有"先到顶、再下落"的那一段才算；先跌后涨的那段不算回撤。
    where: TODO.md C 段（vectorbt 回测）
    caution: 本项目目前**没有**这个指标，因为还没有资金曲线回测。**反例**：路径 100→50→200，最大回撤是 **50%**（100 跌到 50），不是拿 200 和 50 算出的 75%。

  - id: risk_reward
    zh: 盈亏比
    en: risk-reward ratio
    cat: 方法论
    plain: 这里是**预设**的「止盈距离 ÷ 止损距离」，**不是**已经赚到的平均盈亏。本项目该参数为 2.0，表示止盈目标挂在风险的 2 倍处。
    analogy: 像出门前先定好"赚 20 就走、亏 10 就撤"——这是**计划**，不是最后的结果。
    where: Config.reward_risk（take_profit = close + reward_risk × risk_per_unit）
    caution: 它只决定下单时挂的止盈/止损位置。**真实盈亏比要等交易结果出来才知道**，两者不是一回事。盈亏比高也不代表赚钱，还要看胜率。

  - id: equity_curve
    zh: 资金曲线
    en: equity curve
    cat: 方法论
    plain: 把每个时间点的账户余额连成一条线，看整体是赚是亏。
    analogy: 像体重曲线——单看某天没意义，要看趋势。
    where: TODO.md C 段（vectorbt 回测）
    caution: 本项目目前只有"事件级回测"，没有资金曲线。

  - id: event_backtest
    zh: 事件级回测
    en: event-level backtest
    cat: 方法论
    plain: 只看"爆拉之前那一天的各项数据对不对得上"，不模拟真实买卖。
    analogy: 像只检查"考前复习有没有抓住重点"，不管实际考了多少分。
    where: research/09_backtest_revised.py
    caution: 它**不是**逐日含成交退出的收益回测，别把它当胜率。

  - id: holder_concentration
    zh: 筹码集中度
    en: holder concentration
    cat: 指标
    plain: 少数钱包掌握了多少比例的币。**但地址不等于实际持有人**——交易所托管、锁仓、合约地址都要区别看待，所以不能直接推断"庄家控盘"。
    analogy: 像统计一个微信群的成员数——账号数不等于真实人数，有小号、有机器人、也有机构代持。
    where: TODO.md C 段（GoPlus）
    caution: TUT 暴涨前前 100 钱包持 98.99%，是**现象记录**；但未识别这些地址的用途前，不能直接判定控盘。本项目目前没有这项数据。

  - id: market_maker
    zh: 做市商
    en: market maker
    cat: 基础概念
    plain: 专门提供买卖盘、让交易能成交的机构。他们调币进出交易所会留下痕迹。
    analogy: 交易所里的批发商——货从他手里进出会留下痕迹；痕迹能观察，但不等于他看涨。
    where: TODO.md C 段（交易所净流入）
    caution: 追踪做市商动向成本最高，但可能最直接。

  - id: exchange_netflow
    zh: 交易所净流入
    en: exchange netflow
    cat: 指标
    plain: 转入交易所的币减去转出的币。大量转入通常意味着准备卖出，大量转出可能是囤币。
    analogy: 像把币从保险柜搬到交易所货架上——货架库存突然变多，通常说明准备卖。
    where: TODO.md C 段
    caution: 需要链上数据，获取成本高。

  - id: macro_regime
    zh: 宏观环境
    en: macro regime
    cat: 方法论
    plain: 整个市场是"进攻"还是"防守"的状态，比如 BTC 在涨还是跌。
    analogy: 像出海看天气——晴天出海和台风天出海，策略该不一样。
    where: TODO.md C 段
    caution: 本项目目前没有这层过滤，risk-off 时照样输出一堆标的。

  - id: degraded_scan
    zh: 降级扫描
    en: degraded scan
    cat: 工程
    plain: 部分数据拿不到时，用剩下的数据继续跑，而不是整个程序停掉。
    analogy: 像手机没信号时还能用离线地图，而不是直接黑屏。
    where: TODO.md A2
    caution: 代价是那段时间评分系统性偏低（缺合约三项）。

  - id: websocket
    zh: 实时推送
    en: websocket
    cat: 工程
    plain: 服务器主动把新消息推给你，不用你反复去问。
    analogy: 像订阅报纸——新一期自动送到家，不用每天跑报刊亭。
    where: TODO.md C 段（公告监控）
    caution: 比定时轮询更实时，但依赖第三方库稳定性。

  - id: sqlite
    zh: SQLite
    en: SQLite
    cat: 工程
    plain: 一个文件就是一个数据库，不需要装服务器，适合本地存记录。
    analogy: 像 Excel 文件，但查询更快、更不容易写坏。
    where: TODO.md C 段（结果落库）
    caution: 用来长期存"每天选出哪些币"，才能事后统计真实命中率。

  - id: vectorbt
    zh: vectorbt
    en: vectorbt
    cat: 工程
    plain: 一个 Python 回测库，能快速算出收益、回撤这些指标。
    analogy: 像 Excel 的图表功能，但专门为"模拟交易"设计。
    where: TODO.md C 段
    caution: 用它需要先定义入场/出场规则，而本项目的定位可能与之冲突（只做筛选）。

  - id: goplus
    zh: GoPlus
    en: GoPlus
    cat: 数据源
    plain: 一个免费提供代币安全与持币分布数据的服务。
    analogy: 像查企业的工商信息，看这家公司股东都有谁。
    where: TODO.md C 段（筹码集中度）
    caution: 第三方 API，稳定性未验证。

  # ===== 2026-10-05 补充：请求治理（P0–P2）=====

  - id: backoff
    zh: 限流退让
    en: backoff
    cat: 工程
    plain: 被交易所限流或封禁后，立刻停止请求并等到恢复时间再试，而不是按固定间隔反复撞。
    analogy: 像敲门被保安拒绝后先走开等通知，而不是站在门口一直敲——一直敲只会被封得更久。
    where: binance_box_strategy.py 的 RateLimitState / RequestGuard、results/rate_limit_state.json
    caution: 恢复时间解析自服务端返回（banned until 毫秒时间戳或 Retry-After 秒数）；解析不到时按保守值退让并在日志写明。到期后只发一次恢复探测，失败进入冷却。暂停按「域+出口」分开记——代理出口被封不影响直连出口。

  - id: deriv_cache
    zh: 合约数据小时缓存
    en: deriv cache
    cat: 工程
    plain: OI 增速和大户持仓多空比是一小时一格的数据，取回来后同一小时内直接复用，不再重复问交易所。
    analogy: 像把今天的课程表抄在手上——一天之内不用反复跑教务处问。
    where: fetch_deriv_context() 的 _DERIV_CACHE、DERIV_CACHE_BUCKET_MS、环境变量 DERIV_CACHE
    caution: 代价是数据最多滞后到「整点后第一轮取到的样子」；DERIV_CACHE=false 可关闭。只缓存状态为正常(ok)的结果，取失败的下一轮重试。

  - id: deriv_status
    zh: 合约数据状态
    en: deriv_status
    cat: 工程
    plain: 标记每个币的合约数据是完整取到、只取到一部分、取失败，还是因限流暂停根本没去取。
    analogy: 像快递单上的物流状态——「已签收/部分签收/派送失败/暂时停发」写清楚，才不会把"没送到"当成"没有货"。
    where: 扫描 CSV 的 deriv_status / deriv_as_of 列、render_table 的「合约数据」列
    caution: 取值 ok / partial / failed / paused / no_futures。**缺失 ≠ 没机会**：评分按缺项处理，缺项不是 0 分证据；deriv_as_of 是数据自身的观测时间，过期数据不能冒充当前证据。回退到全市场账户口径时一律标 partial，防止冒充大户持仓口径（见 REASONING.md C4）。

  # ===== 2026-10-15 补充：多模型协作流程 =====

  - id: cross_review
    zh: 交叉审查
    en: cross review
    cat: 工程
    plain: 一个模型做完的活，交给另一个模型去挑毛病。挑毛病的人不重做，只按验收清单逐条核对，每条给出「通过」或「缺什么证据」。
    analogy: 像两人互改考卷——答题的人不给自己打分，改卷的人按评分标准逐题对答案，而不是按自己的想法重写一遍。
    where: reports/a1_stage2_ds/ 与 reports/a1_stage2_glm53f/ 的互验目录、OBSERVATION_PLAN.md 第 11.7 节
    caution: 审查者只核对验收清单与证据，不改对方输出；互审最多两轮，之后仍有实质分歧就升级仲裁，不无限互审烧 token。

  - id: arbitration_review
    zh: 仲裁审查
    en: arbitration review
    cat: 工程
    plain: 双方互相挑毛病之后还有争不出来的关键分歧时，请第三个没参与争论的实例来裁。它只看双方的最终结论和验收清单，不看双方争论的过程，避免被某一方的说法带偏。
    where: reports/a1_stage2_review/（分歧仲裁落点）；AGENTS.md「多模型协作流程」节
    caution: 仲裁也裁不下来的分歧才升级给用户；用户只判「对最终交付影响多大」，不判谁对谁错。仲裁实例须用未参与本轮生产的角色或提示词变体。

  # ===== 2026-10-17 补充：任务编号 / 轮次 / M 分块（用户指出无处可查）=====

  - id: task_letters
    zh: 任务编号（A/B/C）
    en: task letters
    cat: 工程
    plain: TODO.md 给每件没做完的事编的号。A 开头是最高优先级（如 A1 历史双向研究，就是回答"少看币会不会漏掉大行情"的那件事）；B 开头是已经验证有价值、还没开工的（如 B6 仓库盘点）；C 开头是想法不错但可行性未验证的候选。
    where: TODO.md 的 A/B/C 三节
    caution: 编号只代表优先级分类，不代表先后顺序；每条的权威解释就在 TODO.md 那一条里（做什么/为什么/怎么开始/验收），不在别处。

  - id: repair_round
    zh: 返修轮次（r1/r2/r3）
    en: repair round
    cat: 工程
    plain: 研究交付是"一个模型交作业、另一个挑错、错了打回重做"这么滚的。r1、r2、r3 就是第几轮交付：r2 挑出一批测量错误，r3 是照着 r2 的错题清单修完后的第三轮交付。每轮的报告放在 reports/ 对应目录的 rN 子目录里。
    where: reports/a1_stage2_ds/r3/、reports/a1_stage2_glm53f/r3/、tasks/a1_r3_followup_20261014.md
    caution: 轮次不是版本升级——r3 通过只说明"这轮修的错清零"，不等于策略变好或收益改善。

  - id: m_block
    zh: M 分块（M0/M1/M2）
    en: M block
    cat: 工程
    plain: 一轮返修里拆开的三块活。M0 = 来源身份与重复小时（把 713 个数据来源对清楚，同一个币同一个小时不能算两遍）；M1 = 排序读未来（修"打分时偷看还没收盘的K线"）；M2 = 后果与回撤（信号出现后价格怎么走、先跌多深，参考时刻和数据缺口怎么算）。
    where: tasks/a1_r3_followup_20261014.md 第 2/3/4 节
    caution: M 编号只在 r3 任务书体系内使用；后续轮次若重新拆块，编号含义以当时任务书为准，不能拿旧含义套新轮次。

  # 2026-10-19 · gpt6astra：头脑风暴新增术语；定义真源，策略效用均待验证。

  - id: reflexivity
    zh: 反身性
    en: reflexivity
    cat: 方法论
    plain: 参与者的判断会改变行动，行动改变市场现实，现实又反过来改变判断。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 价格上涨与持仓一起增加，不能单独证明这条反馈链成立；本轮用于提出待验证机制。

  - id: liquidity
    zh: 流动性
    en: liquidity
    cat: 基础概念
    plain: 在想买卖的时候，市场能否以接近当前报价成交所需数量。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 成交额高、曾出现高价，都不保证你需要退出时能卖出相同数量。

  - id: price_impact
    zh: 价格冲击
    en: price impact
    cat: 方法论
    plain: 一笔或一批买卖发生时，市场报价随之变化的程度。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 一起发生不等于全部由该笔交易造成；还要区分同时到来的消息和其他买卖。

  - id: attention_budget
    zh: 注意力预算
    en: attention budget
    cat: 方法论
    plain: 人每天实际能用于看币、核对资料和重新判断的时间与精力。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 名单短不等于省时；后台人工核实、重复提醒和中途换币都要计入。

  - id: information_value
    zh: 信息价值
    en: value of information
    cat: 方法论
    plain: 某条新资料能在多大程度上改变现在应该继续看、参与、等待或退出的判断。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 不能看到后来涨跌后才决定哪条资料最有价值；研究价值不等于盈利。

  - id: stage_transition
    zh: 阶段转换
    en: stage transition
    cat: 方法论
    plain: 依据当时新出现的证据，把一条机会从酝酿、启动、回撤等判断转到另一种判断。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 阶段不是市场保证会依次完成的流程；可以直接上涨、反复失败，也可以资料不足而无法判断。

  - id: source_independence
    zh: 来源独立性
    en: source independence
    cat: 方法论
    plain: 看似多条证据是否分别来自不同的观察，还是都复制了同一条信息。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 多个账号、地址或模型赞同不自动构成多份独立证据；不能无凭据认定它们属于同一个人。

  - id: value_capture
    zh: 价值归属
    en: value capture
    cat: 方法论
    plain: 一项业务或使用活动创造的好处，究竟通过什么规则到达持币者。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 产品成功、收入增长不自动意味着代币价值增长；需核实分配权或实际必要用途。

  - id: activity_clock
    zh: 活动时钟
    en: activity clock
    cat: 方法论
    plain: 按发生了多少买卖或其他市场活动划分观察阶段，而不总按固定分钟或小时划分。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 更频繁观察本身可能增加提醒负担；能否改善判断仍待验证。

  - id: counterfactual
    zh: 反事实比较
    en: counterfactual comparison
    cat: 方法论
    plain: 比较其他条件相同时，如果某个条件不同，结果可能有什么不同。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 历史中另一种结果未必能直接看到；假设不成立或资料不足时不能把模拟当事实。

  - id: rule_search
    zh: 规则搜索
    en: rule search
    cat: 方法论
    plain: 让程序在事先限定的表达范围内提出和比较多条判断规则，并保留失败记录。
    where: research_committee/20261019_verified/final/gpt6astra_brainstorm.md（gpt6astra）
    caution: 多试几次后挑最好结果容易把运气当本领；提出规则和确认规则应分开，本轮不实施。


  # ===== 2026-10-20 补充：A16–A18 实验产生的新概念（用户反馈"看不懂"）=====

  - id: additive_score
    zh: 加法积分制
    en: additive scoring
    cat: 评分条件
    plain: 每个条件各给一个分，全部加起来，总分过线就入选。任何一项不合格都能被其他项的分数补上。
    analogy: 像高考总分过线就能上——语文考 0 分，只要数学满分，照样录取。
    where: binance_box_strategy.py 的 box_score() / deriv_score()
    caution: **现行规则就是这一种，且没有任何否决项**。实测后果：`score>=5` 的池子占样本 69%，效果几乎等于"只要价格站上 50 日均线"。想表达"某一项必须成立"时，加法做不到，必须用否决制。

  - id: veto
    zh: 一票否决
    en: veto / conjunctive gate
    cat: 评分条件
    plain: 规定某几项必须同时成立，只要有一项不成立就直接排除，不许用别的项补分。
    analogy: 像驾照体检——视力不过关，其他项再好也不能发证。
    where: 尚未实现；实验计划见 TODO.md 的 A20
    caution: 初步试探显示否决制能提高命中率，但**7 天收益 4/4 下降**。它换的是"更纯的池子"，不是"更多的钱"。别默认它更好。

  - id: rank_key
    zh: 排序键
    en: rank key
    cat: 方法论
    plain: 决定候选池里"先看谁"的那个数值。和"谁能进池"是两件不同的事。
    analogy: 像面试——录取标准决定谁能进面试，排序键决定面试顺序。顺序错了，好人也排在后面。
    where: binance_box_strategy.py 的 Config.rank_key
    caution: **本项目踩过大坑**：一度用总分当排序键，结果分数最高的那批后面收益最差（4 个时间段全负）。2026-10-20 起改用"24 小时主动买占比"。分数仍用于决定谁能进池，只是不再决定顺序。

  - id: ic
    zh: 信息系数
    en: IC (information coefficient)
    cat: 方法论
    plain: 某个数值和"后面实际涨了多少"的排名相关程度。+1 是完全同向，0 是毫无关系，−1 是完全反向。
    analogy: 像考试前老师给的排名，和期末实际排名的吻合度。
    where: research/14_variable_bench.py 的 _spearman()
    caution: 0.05 就已经算有信息了，不要拿 0.8 当标准。**IC 超过 0.5 基本都是算错了**（本项目踩过两次：把答案混进了特征）。

  - id: quantile_spread
    zh: 分位价差
    en: quantile spread (Q5 − pool)
    cat: 方法论
    plain: 按某个数值把候选池分成五档，看最高那档的实际收益中位数，比整个池子的中位数好多少。
    analogy: 像看"班里前 20% 的平均分"比"全班平均分"高多少——只看平均顺序会漏掉"中间好两头差"的情况。
    where: research/14_variable_bench.py 的 run_rankkey()
    caution: **只看 IC 会被骗**。本项目有个排序键 IC 四段全正，但分位价差 0/4——因为池内是倒 U 形（最高分和最低分都不如中间）。分位价差才是决定性的。

  - id: permutation_test
    zh: 置换检验
    en: permutation test
    cat: 方法论
    plain: 把某个数值随机打乱很多次，看真实结果比"随机情况"好多少，用来判断这个结果是不是运气。
    analogy: 像把一副牌洗 200 次，看真手的牌力排在第几名。
    where: research/14_variable_bench.py 的 permutation_band()
    caution: 本项目的门槛是"真实值必须超过随机情况的 95% 分位"。池子越小，随机波动越大，门槛越难过。

  - id: leakage
    zh: 数据泄漏
    en: data leakage
    cat: 方法论
    plain: 训练模型时不小心把"答案"也当成输入放了进去，导致结果好得不真实。
    analogy: 像考试前把答案抄在草稿纸上带进考场——分数很高，但什么也没学会。
    where: research/16_hier_model.py 的 LEAK / LEAK_PREFIX
    caution: **本项目 2026-10-20 一天内踩了两次**：① 标签列改名后逃过了前缀排除，IC 飙到 0.94；② 用"峰值之后"的数据算出的指标被当成特征。判断方法：**结果好得不像真的，就先查泄漏**。

  - id: tradability
    zh: 可交易性
    en: tradability
    cat: 方法论
    plain: 这个机会在真实操作里到底能不能吃到——买得进、拿得住、卖得掉。
    analogy: 像看到一家店打折，但要先确认它开不开门、你排不排得上队、买完能不能拎走。
    where: research/15_tradability.py
    caution: 本项目实测 822 个翻倍事件里 **95.6% 都是可交易的**，"买不进"是假问题。真正的代价是"拿不住"——平均要先亏 24%、等 24 天才翻倍。

  - id: fill_gap
    zh: 启动跳空
    en: entry gap (gap_t0)
    cat: 指标
    plain: 信号日收盘价，到启动日开盘价，中间跳了百分之几。跳得越多说明越买不进。
    analogy: 像你看到特价消息，跑到店里发现价格已经涨回去了——差价就是跳空。
    where: research/15_tradability.py 的 gap_t0
    caution: 本项目实测中位数 **0.00%**、最大 1.45%。因为"信号日"被定义成起涨前一天，入场点天然在行情之前。**所以这个指标在当前标签里是空的**，换标签定义后才有用。

  - id: keep_frac
    zh: 峰后保留
    en: keep fraction
    cat: 指标
    plain: 涨到最高点之后两天，价格还留着这波涨幅的百分之几。100% 表示一点没跌回去。
    analogy: 像考试超常发挥考了 95 分，两天后补考还能考多少——考 90 分就是保留了九成。
    where: research/15_tradability.py
    caution: 本项目实测中位 **0.836**，说明样本里绝大多数是"涨上去就不下来"的慢牛，**不是插针**。这与"山寨币拉完就崩"的直觉相反。

  - id: amplitude
    zh: 幅度（爆多大）
    en: amplitude
    cat: 方法论
    plain: 一个币如果真涨了，能涨多少倍。和"会不会涨"是两个不同的预测目标。
    analogy: 像"这个人会不会被选进球队"和"他进队后能进几个球"——两个问题，两套判断标准。
    where: research/16_hier_model.py
    caution: **本项目的核心结构发现**：这两个目标在数据里**反向**——最像要涨的，涨了也涨得少。所以不能把两个判断加在一起，也不能相乘。

  - id: identification_layer
    zh: 识别层
    en: identification layer
    cat: 方法论
    plain: 专门判断"这个币会不会涨"的那个模型或那一组条件。
    analogy: 像球队的初选球探，只负责判断"这人够不够格进队"。
    where: research/16_hier_model.py 的 p
    caution: 本项目实测：识别层**很准**（AUC 0.67，和现行总分同级），但它对"涨多少"是 **4/4 反向**的。**"判断准"不等于"能用来排序"**——这是本项目最容易搞错的一点。

  - id: amplitude_layer
    zh: 幅度层
    en: amplitude layer
    cat: 方法论
    plain: 专门判断"已经确定会涨的币，能涨多少"的那个模型。
    analogy: 像球队的进攻教练，只负责判断"已经进队的人能进几个球"。
    where: research/16_hier_model.py 的 a
    caution: 本项目实测**4/4 有效**（IC +0.21~+0.36），但**只在"已确定会涨"的币里有效**。放进整个候选池就失效，因为池里四成根本不会涨，"能涨多少"对它们没有意义。

  - id: hier_model
    zh: 分层建模
    en: hierarchical model
    cat: 方法论
    plain: 把"会不会涨"和"能涨多少"拆成两个模型分别训练，再想办法合起来用。
    analogy: 像先由球探筛人、再由教练排兵——分工明确，但两个人的意见不能简单相乘。
    where: research/16_hier_model.py
    caution: **2026-10-20 实测：相乘失败**（4 个时间段 2 正 2 负）。原因是两个模型在池内负相关（后两段 −0.5~−0.6），相乘等于自毁。取反能修好平均顺序，但修不好尾部（倒 U 形）。

  - id: objective
    zh: 目标函数
    en: objective function
    cat: 方法论
    plain: 你到底想让系统优化什么——是"翻倍的概率最高"，还是"单位时间赚得最多"。
    analogy: 像招人：你要"最不可能离职的人"还是"业绩最高的人"，这两个标准挑出来的是两批人。
    where: TODO.md 的 A21 / KNOWLEDGE §2.15
    caution: **2026-10-20 已给出建议定义**：主指标 = 7 日净收益中位，硬约束 = 90 分位不降。理由是同一批数据换统计量冠军会换人（中位数选现行加法、均值选「6 项中≥3 项」、胜率选「趋势∧突破」），**单一定义必然偏向某一类规则**。

  # ===== 2026-10-20 补充（二）：A20 否决制实验产生的新概念 =====

  - id: pareto_improvement
    zh: 帕累托改进
    en: Pareto improvement
    cat: 方法论
    plain: 一个方案在所有方面都不比现在差、至少一个方面更好。这种方案不用讨论取舍，直接换。
    analogy: 换工作：新工作钱更多、离家更近、同事更好——那就换，不用纠结。只要有一项变差，就得权衡。
    where: research/17_veto_gate.py 的「帕累托改进」列
    caution: 本项目用的是三条同时成立：7 日收益 4/4 不降、爆拉率 4/4 不降、池子真的收紧。**2026-10-20 实测 15 个方案、0 个通过。**

  - id: capture_rate
    zh: 爆拉捕获率
    en: capture rate
    cat: 方法论
    plain: 全市场所有翻倍事件里，你的规则留下了多少。捕获率 10% 就是「一年只抓到十分之一的爆拉币」。
    analogy: 撒网捕鱼：网眼越小，抓到的鱼越多（捕获率高），但捞上来的小鱼小虾也越多（命中率低）。**只看命中率会选出一张只捞大鱼的网，然后一年捞不到几条。**
    where: research/17_veto_gate.py 的「捕获率」列
    caution: **必须和爆拉率一起看。** 本项目实测：`trend∧breakout` 爆拉率 76.9%（最高）但捕获率只有 10.7%——**十次机会错过九次**。

  - id: k_of_n
    zh: k-of-n 规则
    en: k-of-n gate
    cat: 方法论
    plain: 不要求「全部条件都成立」，也不允许「随便凑分」，而是「6 个条件里至少成立 3 个」。
    analogy: 大学录取要求「6 门课里至少 4 门及格」——比「总分过线」严（不能靠一门满分补所有），比「门门及格」松（允许偏科）。
    where: research/17_veto_gate.py 的 k3of6 / k4of6
    caution: 它是加法和合取之间的中间形态，理论上更合理。但本项目实测：**「≥4 项」四个时间段全部样本不足**（只剩 15–37 条），测不出来。

  - id: drop1_test
    zh: 删一条检验
    en: drop-one robustness test
    cat: 方法论
    plain: 把池子里收益最高的那一条删掉，再算一次平均收益。如果结论翻了，说明原来的优势只是靠那一条币。
    analogy: 一支球队场均得分联盟第一，查下去发现队里有个人独得 80% 的分。把他拿掉，球队垫底——**那不叫球队强，叫队里有个超人。**
    where: research/17_veto_gate.py 的 robustness.csv
    caution: **池子小于 100 条时必须做这个检验。** 本项目实测：「6 项中 ≥3 项」均值 +2.2%，删掉最大一条后变成 −1.4%；「trend∧ls_top」+9.5% 变 −3.8%。

  - id: overextension
    zh: 过度延伸
    en: overextension
    cat: 指标
    plain: 价格离 50 日均线有多远。离得越远 = 已经涨得越多 = 后面空间越小。
    analogy: 橡皮筋拉得越长，回弹的概率越大。**已经在半山腰的，不适合当「即将启动」的候选。**
    where: data/vars_cache.parquet 的 `ema50_dist`；research/17_veto_gate.py 的 s5_not_ext / s5_not_ext75
    caution: 本项目实测：在现行池子上加一条「离均线不超过训练集 75 分位」，**池子从 63% 砍到 38%，7 日收益基本不变**（+0.5pp 中位、−0.2pp 均值），但爆拉率从 61.9% 降到 58.1%。**这是取舍，不是改进。**

  # ===== 2026-10-20 补充（三）：A22 比特尺实验产生的新概念 =====

  - id: bit_ceiling
    zh: 比特尺
    en: bit ceiling
    cat: 方法论
    plain: 把"预测得准不准"换算成"减少了多少不确定性"，单位是比特。用来判断"再加指标还有没有用"。
    analogy: 你在猜一箱子里有几个球。已经知道"大概 10 个左右"，再给你 100 把尺子也没用——**你需要的是秤，不是第 101 把尺子。**
    where: research/18_bit_ceiling.py；KNOWLEDGE §2.16
    caution: 本项目实测：126 个变量只消除 **8.3%** 的不确定性（0.081 bit / 0.978 bit）。AUC 从 1 个变量到 111 个变量**不涨反跌**（0.672→0.617）。加到 20 个以上 bit 转负——**不是没信息，是概率校准崩了**（排序还有效，但报出来的数字不可信）。

  - id: calibration
    zh: 概率校准
    en: calibration
    cat: 方法论
    plain: 模型说"70% 会爆"，实际是不是真有七成会爆。**排序准 ≠ 数字可信。**
    analogy: 一个天气预报员判断"下不下雨"挺准，但他说"降水概率 99%"其实只对应 60%。你按 99% 去改行程，就被他的数字骗了。
    where: research/18_bit_ceiling.py 的 bits 列
    caution: 本项目从未做过校准审计（九模型共识 P1-1 提过，一直没做）。已知：变量加到 20 个以上，校准会崩到比"永远猜基准率"还差。

  - id: reskin
    zh: 换皮指标
    en: reskin
    cat: 风险
    plain: 看起来是新指标，其实是已有条件的代数变形，信息完全重合。
    analogy: 同一个演员换了个发型就说"这是新人"。
    where: research_committee/变量清单_92机制可算性分级_20261020.md 的 M05
    caution: **判法：和现有 6 个条件算 Spearman，> 0.5 基本就是换皮。** 实例：M05 `ls_top − ls_count` 与现有 `ls_top` 相关 **0.56**，AUC 0.416 vs 0.390——不是新发现。脑暴清单里这类"假新指标"占比很高。

  - id: information_gain_curve
    zh: 增量信息曲线
    en: information gain curve
    cat: 方法论
    plain: 把变量按"有用程度"排序，一个一个加进去，看总信息量在第几个变量之后不再增长。
    analogy: 往汤里加盐。第一勺明显变咸，第五勺尝不出来了，第十勺开始齁——**加得越多不是越好，是过了拐点就变坏。**
    where: reports/bit_ceiling_ds/bits_curve.csv
    caution: 本项目实测拐点在 **k=12**，k=20 之后转负。**「再加几个指标」这个直觉在数据上是错的。**

  - id: base_rate
    zh: 基准率
    en: base rate
    cat: 方法论
    plain: 在完全不筛选的情况下，随便挑一个币随便挑一天，它发生爆拉的概率。
    analogy: 一个城市里"随便一个人中彩票"的概率，和你"专门挑了一堆买过彩票的人"之后的概率，是两回事。后者高，不是因为你眼光好。
    where: research/19_base_rate.py；KNOWLEDGE §2.17
    caution: 本项目实测 **0.1417%**（822 次 / 580,104 个符号-日，约每 706 个币-日 1 次）。现行策略的真实爆拉率 **0.245%**（基准的 1.7 倍）。**样本内 71% 是案例-对照结构造出来的，不能当真实概率。**

  - id: event_definition
    zh: 事件定义
    en: event definition
    cat: 基础概念
    plain: 「什么算一次爆拉」的精确规则。定义不同，所有统计数字都会变。
    analogy: 说"我们店一天卖出 1000 单"——是按订单算、按包裹算、还是按顾客算？换一种数法，数字立刻不一样。
    where: research/02_detect_pumps.py
    caution: 本项目定义：低点 = 峰前 60 天最低 `low`；峰值 = 30 日滚动涨幅局部新高；`gain = high[P]/low[T] − 1 ≥ 1.0`（即 2 倍）；启动日 = 低点后第一根 `close ≥ close[T]×1.15`。**不是「今天涨 5%」，不是「7 天翻倍」，窗口最长 60 天，用 `high` 所以插针也算。** 822 个事件里 45.9% 只是「刚够翻倍」的 2–3 倍档。

  - id: static_vs_dynamic
    zh: 静态 vs 动态
    en: static vs dynamic
    cat: 方法论
    plain: 静态看「此刻是什么样」，动态看「最近在往哪个方向变、变多快」。
    analogy: 体检报告 vs 体检报告 + 趋势图。前者告诉你今天多重，后者告诉你三个月涨了 20 斤——后者才是早期信号。
    where: research/20_dynamic_score.py；KNOWLEDGE §2.18
    caution: 本项目现行策略**基本是静态的**：18 分里 `c_trend`(5)+`c_breakout`(2)+`ls_top`(3)=8 分是纯状态量，其余 10 分是「一天的差」，没有一项看轨迹。但动态改造实测**没有增量**（4 折 −0.015），原因是分数有界——「在涨」有一大半是「本来就在高位」。

  - id: score_trajectory
    zh: 分数轨迹
    en: score trajectory
    cat: 方法论
    plain: 把同一套评分在过去若干天每天算一遍，排成一条时间序列。
    analogy: 不是拍一张照片，是拍一段延时摄影——能看出「正在发生什么」而不只是「现在是什么」。
    where: research/20_dynamic_score.py；reports/dynamic_ds/features.csv
    caution: 本项目用 16 天窗口、每天取 22:00 那根 1h K 线。**重算分与现行 `score` 100% 逐行相同**（决策点必须对齐到 22:00，H=20/21/23 只有 77–81% 一致）。

  - id: bounded_score
    zh: 有界分数陷阱
    en: bounded score trap
    cat: 风险
    plain: 分数有上下限时，「涨了多少分」这个变化量天然和「现在多少分」高度相关，不是独立信息。
    analogy: 一个身高 190 的人「一年长了 2cm」，和一个 150 的人「一年长了 10cm」——后者的「增长」数字更大，但你不能因此说后者更容易长高。
    where: KNOWLEDGE §6.2 误区 11
    caution: 分数是 0–18 的有界量，**「3 天涨 5 分」的前提是本来就在高位，18 分不可能再涨**。实测 `d_score_3` 与 `score` 的 Spearman **0.632**，属换皮。**单变量 AUC 0.65 ≠ 有增量信息**，必须把静态分放进同一个模型再比。

  - id: conditional_bias
    zh: 条件化偏误
    en: conditional bias
    cat: 方法论
    plain: 在一个「有问题的子集」里做检验，得出的结论只对那个子集成立，却被当成对全世界成立。
    analogy: 在一家只看感冒的社区医院里测试核磁共振仪，测出「对感冒没用」，于是把仪器退了。仪器没问题，是用错了地方。
    where: KNOWLEDGE §2.19；research/21_death_audit.py
    caution: 本项目所有「增量检验」都在 `score>=5` 池内做，而池子本身有问题（A16 排序反、A24 真实命中率 0.245%）。**同一变量 `score` 对 7 日收益：全样本 +0.160、池内 −0.09~−0.12，符号相反。**

  - id: null_distribution
    zh: 零分布
    en: null distribution
    cat: 方法论
    plain: 在「什么都不成立」的情况下，把同一个检验重复很多次，看结果能有多好看——用来判断「好看」是不是碰巧。
    analogy: 考试只有 4 道判断题，瞎蒙也能全对，概率 1/16。所以「4 道全对」在这张卷子上不算本事。
    where: research/21_death_audit.py（随机键 200 次）
    caution: 实测「4 折都不降」这个判据，**随机排序也有 7.5% 的概率通过**；测 15 条规则的期望假阳性 ≈ 1.1 条。**任何折数类判据都必须配随机键零分布**，否则「通过」和「不通过」都不可信。

  - id: statistical_power
    zh: 统计功效 / 分辨力
    en: statistical power
    cat: 方法论
    plain: 这台仪器能分辨多大的差距。差距比这个数小，测了也等于没测。
    analogy: 拿一把刻度是 3.5 厘米的尺子，去量两个人 2 厘米的身高差。量十次结果有正有负，你会得出「两人一样高」——但真相是你根本量不出来。
    where: KNOWLEDGE §2.19；reports/death_audit_ds/report.md §五
    caution: 本项目四折检验的分辨力：折内中位差 SD **1.76pp**，95% 带 **±3.5pp**。**要找的差距是 2pp，噪声比信号还大**——样本要放大约 **3 倍**（974 → 约 2,909 条）才能分辨。

  - id: death_grade
    zh: 判死成色
    en: death grade
    cat: 方法论
    plain: 判一个想法「死刑」时，必须说清是哪一种死法——因为不同死法的可挽回程度完全不同。
    analogy: 医生写死亡原因，写「心脏停跳」和写「没查出来」是两件事；后者不能算确诊，只能算还没查。
    where: KNOWLEDGE §2.19、§2.20；research_ledger.json 的 grade 字段；TODO.md 研究推进方式第 5 条
    caution: 七级：无信息 / 同轴 / 测不动 / 弱信号 / 没测 / 有害 / 收益无改进。**「测不动」「没测」「弱信号」不是判死，是暂缓**——它们说的是仪器不行或证据不够，不是这个想法不行。写「判死／测不动」是自相矛盾，`tools/ledger.py audit` 会拦。

  - id: idea_ledger
    zh: 想法台账
    en: research ledger
    cat: 工程
    plain: 一张按「想法」而不是按「时间」排的清单，每条记着：做过没有、为什么停、什么条件能重开、判决改过几次。
    analogy: 医院病历。同一个病人换科室看，新医生翻病历就知道以前查过什么、为什么没继续——不用病人自己记得。
    where: research_ledger.json（数据源）；tools/ledger.py（check/trace/reopen/audit/stats/build）；research_committee/想法台账.md（生成物）
    caution: 它只放**已经做出判决**的条目。待做在 TODO.md，没测没判的 92 个机制在变量清单——三者不互相替代。`想法台账.md` 是 `build` 出来的，手改会被覆盖。

  - id: reopen_condition
    zh: 重启条件
    en: reopen condition
    cat: 方法论
    plain: 一个被判死或暂缓的想法，在什么情况下值得再测一次。写不出这一条，就等于把这个想法永久扔掉了。
    analogy: 不是「这个方案不行」，而是「在现在这个预算下不行，预算翻三倍再试」——后者才是可执行的话。
    where: research_ledger.json 的 reopen_if 字段；tools/ledger.py reopen 命令
    caution: 现状：41 条里 16 条带重启条件。**这是「暂缓但不排除」能落地的唯一载体**——没有它，「暂缓」和「判死」在实践中没区别，因为没人会想起来重开。

  - id: composition_effect
    zh: 构成效应
    en: composition effect
    cat: 方法论
    plain: 两组数字看起来有差，其实不是「同一个东西变了」，而是「两组的成员构成不一样」。
    analogy: 甲班平均分高，不是老师教得好，是甲班转来了三个学霸。看平均分你会以为教学质量提升了。
    where: KNOWLEDGE §2.22；research_committee/A21_M04落地_20261021.md §1
    caution: 本项目实例：M04 否决规则「爆拉率 4/4 降」其实是构成效应——`oi_value` 缺失等价于「这个币没有合约市场」，那批样本爆拉率 86.1%，否决规则顺手把它们剔掉了，掉的不是杠杆。**凡是「某组被剔掉一部分后再和原组比」，都要先问：剔掉的那部分和留下的那部分，本来就不是同一批样本吗？**

  - id: as_of_time
    zh: 可得时点
    en: as-of time
    cat: 方法论
    plain: 这个数字在「什么时刻」才真的能被人看到。取值时刻晚于决策时刻，就是前视。
    analogy: 考试 10 点交卷，你 10 点零 5 分才看到标准答案——那不算你自己做出来的。
    where: KNOWLEDGE §2.21；research/23_field_lag_audit.py
    caution: 本项目实测：归档全部 T+1（metrics 30.6–31.7h、日度 K 线 32–33.7h、月度 K 线 M+2），实盘 API 是 T+0（已收盘桶约 10 秒后可得、不改写）。决策点是 `pre_day 22:00 UTC`，而合约特征取的是当天 23:55 → **前视 55 分钟**。换成 22:55 重算后 AUC 0.604→0.603，**不影响结论**。
